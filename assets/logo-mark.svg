<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EARP Lab logo">
  <defs>
    <linearGradient id="earpGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c6bed"/>
      <stop offset="1" stop-color="#0ea5a8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#earpGrad)"/>
  <!-- relational network: three agents linked to a shared centre -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="32" y1="32" x2="20" y2="19"/>
    <line x1="32" y1="32" x2="46" y2="22"/>
    <line x1="32" y1="32" x2="30" y2="48"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="32" r="5.4"/>
    <circle cx="20" cy="19" r="4.2"/>
    <circle cx="46" cy="22" r="4.2"/>
    <circle cx="30" cy="48" r="4.2"/>
  </g>
</svg>
