<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EARP Lab</title>
  <meta name="description" content="EARP Lab — Experimental Bioethics, AI, and Relational Moral Psychology Lab, directed by Brian D. Earp at the National University of Singapore." />
  <link rel="icon" type="image/svg+xml" href="assets/EARP_logo_small.jpg" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#faf7f1;
      --surface:#fffefb;
      --ink:#15314e;
      --body:#39373a;
      --muted:#867f77;
      --line:#e7e0d3;
      --line-strong:#d6cdbc;
      --accent:#cc6a2b;
      --accent-deep:#a8521d;
      --accent-bright:#e07a36;
      --accent-soft:#f8ecdf;
      --maxw:1080px;
    }
    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      background:var(--paper);
      color:var(--body);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:17px;
      line-height:1.62;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    h1,h2,h3,h4{ font-family:Newsreader,Georgia,"Times New Roman",serif; color:var(--ink); font-weight:500; letter-spacing:-0.01em; }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ color:var(--accent-deep); }
    em{ font-style:italic; }

    .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 32px; }

    /* ---- eyebrow + section heading ---- */
    .eyebrow{ font-size:0.72rem; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
    .section-title{ font-size:1.6rem; line-height:1.15; margin:0 0 28px; }

    .page{ display:none; }
    .page.active{ display:block; animation:fade .3s ease; }
    @keyframes fade{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;} }

    /* ---- header ---- */
    header.site-header{ border-bottom:1px solid var(--line); background:rgba(250,248,243,0.9); backdrop-filter:blur(6px); position:sticky; top:0; z-index:20; }
    .header-inner{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 32px; max-width:var(--maxw); margin:0 auto; }
    .brand{ display:flex; align-items:center; gap:15px; color:inherit; }
    .brand img{ width:46px; height:46px; flex:none; }
    .brand > span{ display:flex; flex-direction:column; }
    .brand .title{ display:block; font-family:Newsreader,Georgia,serif; font-size:1.85rem; font-weight:600; line-height:1.05; color:var(--ink); letter-spacing:-0.015em; }
    .brand .subtitle{ display:block; font-size:0.8rem; color:var(--muted); margin-top:4px; letter-spacing:0.01em; max-width:none; }
    nav.top-nav{ display:flex; gap:30px; align-items:center; }
    .tab{ font-size:0.82rem; font-weight:600; letter-spacing:0.13em; text-transform:uppercase; color:var(--muted); padding:6px 0; position:relative; }
    .tab:hover{ color:var(--ink); }
    .tab.active{ color:var(--ink); }
    .tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--accent-bright); }

    main{ padding:56px 0 40px; }

    /* ---- intro / about ---- */
    .intro{ max-width:var(--maxw); }
    .intro .lead{ font-family:Newsreader,Georgia,serif; font-size:1.42rem; line-height:1.5; color:var(--ink); font-weight:400; margin:0; }

    .rule{ border:0; border-top:1px solid var(--line); margin:56px 0; }

    /* ---- research themes ---- */
    .themes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    .theme{ text-align:center; padding:18px 12px; }
    .theme .ic{ width:30px; height:30px; margin:0 auto 14px; color:var(--accent-bright); }
    .theme .ic svg{ width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.25; stroke-linecap:round; stroke-linejoin:round; }
    .theme p{ margin:0; font-size:0.9rem; line-height:1.4; color:var(--ink); }
    .theme .num{ font-family:Newsreader,serif; font-style:italic; color:var(--muted); font-size:0.9rem; display:block; margin-bottom:8px; }

    /* ---- two-column home blocks ---- */
    .cols{ display:grid; grid-template-columns:1fr 1fr; gap:64px; }
    .pub-list, .news-list{ display:flex; flex-direction:column; }
    .pub-row{ padding:16px 0; border-top:1px solid var(--line); font-size:0.96rem; line-height:1.55; color:var(--body); }
    .pub-row:first-child{ border-top:0; }
    .pub-row a{ color:inherit; display:block; }
    .pub-row a:hover{ color:var(--accent); }
    .news-row{ display:block; padding:16px 0; border-top:1px solid var(--line); color:inherit; }
    .news-row:first-child{ border-top:0; }
    .news-row .t{ font-family:Newsreader,serif; font-size:1.1rem; color:var(--ink); }
    .news-row:hover .t{ color:var(--accent); }
    .news-row .d{ font-size:0.78rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); margin:4px 0 6px; }
    .news-row .s{ font-size:0.92rem; color:var(--body); }

    /* ---- people ---- */
    .group{ margin-bottom:52px; }
    .group-head{ margin-bottom:26px; }
    .group-head h2{ font-size:1.35rem; margin:0; padding-bottom:14px; border-bottom:1px solid var(--line-strong); }
    .members{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
    .member{ background:var(--surface); border:1px solid var(--line); border-radius:4px; align-self:start; transition:border-color .2s ease, box-shadow .2s ease; }
    .member:hover{ border-color:var(--line-strong); box-shadow:0 6px 24px rgba(31,29,26,0.05); }
    .member-toggle{ width:100%; border:0; background:none; cursor:pointer; padding:20px; display:grid; grid-template-columns:58px 1fr; gap:16px; align-items:center; text-align:left; color:inherit; font-family:inherit; }
    .avatar-wrap{ width:58px; height:58px; border-radius:50%; flex:none; display:grid; place-items:center; overflow:hidden; background:var(--accent-soft); color:var(--accent); font-family:Newsreader,serif; font-size:1.2rem; border:1px solid var(--line); }
    .avatar-wrap img{ width:100%; height:100%; object-fit:cover; }
    .member-name{ font-family:Newsreader,serif; font-size:1.12rem; font-weight:500; color:var(--ink); margin:0; line-height:1.2; }
    .member-role{ font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin:5px 0 0; }
    .member-details{ display:none; padding:0 20px 20px; }
    .member.open .member-details{ display:block; }
    .member-details .inner{ border-top:1px solid var(--line); padding-top:14px; font-size:0.92rem; }
    .detail-row{ margin-bottom:7px; color:var(--body); overflow-wrap:anywhere; word-break:break-word; }
    .detail-row .lbl{ color:var(--muted); }
    .detail-row a{ overflow-wrap:anywhere; word-break:break-word; }
    .member-bio{ margin-top:12px; color:var(--body); line-height:1.6; }

    /* ---- publications page ---- */
    .pubs-full{ max-width:960px; }
    .apa-item{ padding:20px 0; border-top:1px solid var(--line); line-height:1.62; color:var(--body); }
    .apa-item:first-child{ border-top:0; }
    .apa-item .doi{ display:inline-block; margin-top:4px; font-size:0.88rem; }

    /* ---- news detail ---- */
    .news-detail{ max-width:720px; }
    .back-link{ display:inline-block; margin-bottom:22px; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; }
    .news-detail h2{ font-size:2rem; line-height:1.18; margin:0 0 10px; }
    .news-detail .d{ font-size:0.8rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); margin-bottom:22px; }
    .news-detail :where(p){ font-size:1.05rem; line-height:1.7; color:var(--body); }

    /* ---- footer ---- */
    footer.footer{ border-top:1px solid var(--line); margin-top:64px; }
    .footer-inner{ max-width:var(--maxw); margin:0 auto; padding:32px; display:flex; flex-direction:column; align-items:center; gap:16px; }
    .social{ display:flex; gap:16px; }
    .social a{ width:34px; height:34px; border:1px solid var(--line-strong); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); transition:color .2s, border-color .2s; }
    .social a:hover{ color:var(--accent); border-color:var(--accent); }
    .social svg{ width:15px; height:15px; fill:currentColor; }
    .copyright{ font-size:0.8rem; color:var(--muted); text-align:center; letter-spacing:0.02em; }

    @media (max-width:860px){
      .header-inner{ flex-direction:column; align-items:flex-start; gap:16px; }
      .cols{ grid-template-columns:1fr; gap:48px; }
      .themes{ grid-template-columns:repeat(2,1fr); gap:20px; }
      .brand .title{ font-size:1.6rem; }
    }
    @media (max-width:480px){
      .wrap, .header-inner, .footer-inner{ padding-left:22px; padding-right:22px; }
      .themes{ grid-template-columns:1fr 1fr; }
      .intro .lead{ font-size:1.25rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="EARP Lab home">
        <img src="assets/EARP_logo_small.jpg" alt="" />
        <span>
          <span class="title" id="brandName">EARP Lab</span>
          <span class="subtitle" id="brandSub"></span>
        </span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a class="tab" href="#home" data-page="home">Home</a>
        <a class="tab" href="#people" data-page="people">People</a>
        <a class="tab" href="#publications" data-page="publications">Publications</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section id="home" class="page">
        <div class="intro">
          <p class="eyebrow">The Lab</p>
          <p class="lead" id="aboutText"></p>
        </div>

        <hr class="rule" />

        <p class="eyebrow">Research</p>
        <div class="themes" id="themeGrid"></div>

        <hr class="rule" />

        <div class="cols">
          <div>
            <p class="eyebrow">Selected work</p>
            <h2 class="section-title">Representative publications</h2>
            <div class="pub-list" id="featuredPubs"></div>
          </div>
          <div>
            <p class="eyebrow">News</p>
            <h2 class="section-title">Recent updates</h2>
            <div class="news-list" id="newsList"></div>
          </div>
        </div>
      </section>

      <section id="people" class="page">
        <p class="eyebrow">The Team</p>
        <h2 class="section-title">People</h2>
        <div id="peopleGroups"></div>
      </section>

      <section id="publications" class="page">
        <p class="eyebrow">Bibliography</p>
        <h2 class="section-title">Publications</h2>
        <div class="pubs-full" id="allPubs"></div>
      </section>

      <section id="news" class="page">
        <div class="news-detail">
          <a class="back-link" href="#home">← Back</a>
          <div id="newsDetail"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="social" id="socialLinks"></div>
      <div class="copyright">© <span id="year"></span> EARP Lab · Centre for Biomedical Ethics, National University of Singapore</div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    const D = window.SITE_DATA || {};

    const THEME_ICONS = {
      balance:'<svg viewBox="0 0 24 24"><path d="M12 3v18M6 21h12M12 6l-7 2 3 6a3 3 0 0 0 6 0l-3-6m4 0 3 6a3 3 0 0 1-6 0"/></svg>',
      chip:'<svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/><path d="M9.5 9.5h5v5h-5zM9.5 3v2M14.5 3v2M9.5 19v2M14.5 19v2M3 9.5h2M3 14.5h2M19 9.5h2M19 14.5h2"/></svg>',
      relations:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="7" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.7 7.5 11 16M16.4 8.6 13 16M8.1 6.4h7.8"/></svg>',
      brain:'<svg viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8V15a3 3 0 0 0 4 2.8M15 4a3 3 0 0 1 3 3 3 3 0 0 1 1 5.8V15a3 3 0 0 1-4 2.8M9 4a2.5 2.5 0 0 1 3 0M9 17.8a2.5 2.5 0 0 0 3 0M12 4v14"/></svg>',
      spark:'<svg viewBox="0 0 24 24"><path d="M12 3v3.5M12 17.5V21M3 12h3.5M17.5 12H21M6 6l2.4 2.4M15.6 15.6 18 18M18 6l-2.4 2.4M8.4 15.6 6 18"/><circle cx="12" cy="12" r="2.3"/></svg>',
      book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19a2 2 0 0 0 2 2h13"/></svg>'
    };
    const SOCIAL_ICONS = {
      website:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 6 3.5 9S14.5 18.5 12 21M12 3C9.5 5.5 8.5 9 8.5 12s1 6.5 3.5 9"/></svg>',
      email:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 5.5A1.5 1.5 0 013.5 4h17A1.5 1.5 0 0122 5.5v13A1.5 1.5 0 0120.5 20h-17A1.5 1.5 0 012 18.5zM4 7l8 5 8-5"/></svg>',
      github:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-3.2 19.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.3-1.2-3.3-1.2-.4-1-.9-1.3-.9-1.3-.8-.6.1-.6.1-.6.9.1 1.4.9 1.4.9.8 1.4 2.1 1 2.7.8.1-.6.3-1 .6-1.3-2.2-.2-4.6-1.1-4.6-5a3.9 3.9 0 011-2.8 3.6 3.6 0 01.1-2.7s.9-.3 3 .9a10.6 10.6 0 015.5 0c2.1-1.2 3-.9 3-.9.6 1.6.2 2.5.1 2.7a3.9 3.9 0 011 2.8c0 4-2.4 4.8-4.6 5 .4.4.7 1 .7 2v3c0 .3.2.6.7.5A10 10 0 0012 2z"/></svg>',
      bluesky:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.8C10.9 8.5 7.9 4.6 5 3 3 1.9 2 2.5 2 5.3c0 1.1.6 6.6 1 7.5.5 1.4 1.9 1.8 3.2 1.6-2.3.4-2.9 1.9-1.6 3.4 2.4 2.8 3.5-.7 3.8-1.6.1-.3.2-.5.6-.5s.5.2.6.5c.3.9 1.4 4.4 3.8 1.6 1.3-1.5.7-3-1.6-3.4 1.3.2 2.7-.2 3.2-1.6.4-.9 1-6.4 1-7.5 0-2.8-1-3.4-3-2.3-2.9 1.6-5.9 5.5-7 7.8z"/></svg>',
      twitter:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-6.9 7.9L23 22h-6.9l-5.4-6.9L4.6 22H1.5l7.4-8.5L1 2h7l4.9 6.4zm-1.2 18h1.7L7.1 3.9H5.3z"/></svg>',
      linkedin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 6.5A2.5 2.5 0 116.5 1a2.5 2.5 0 010 5.5zM2 23V8h4.9v15zm7.5 0V8h4.7v2.1c.7-1.2 2.3-2.5 4.7-2.5 3.5 0 4.6 2.1 4.6 5.6V23h-4.9v-7c0-1.7-.6-2.9-2.1-2.9-1.2 0-1.8.8-2.1 1.6-.1.3-.1.7-.1 1V23z"/></svg>',
      scholar:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 8l11 6 9-4.9V16h2V8zM5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8z"/></svg>'
    };

    const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const initials = n => (n||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const fmtDate = iso => { const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'}); };

    document.getElementById('brandName').textContent = D.lab?.name || 'EARP Lab';
    document.getElementById('brandSub').textContent = D.lab?.subtitle || '';
    document.title = D.lab?.name || 'EARP Lab';
    document.getElementById('aboutText').textContent = D.about || '';
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('themeGrid').innerHTML = (D.themes||[]).map((t,i)=>
      `<div class="theme"><div class="ic">${THEME_ICONS[t.icon]||THEME_ICONS.spark}</div><p>${esc(t.label)}</p></div>`
    ).join('');

    const featured = (D.publications||[]).filter(p=>p.featured);
    const featList = featured.length?featured:(D.publications||[]).slice(0,3);
    document.getElementById('featuredPubs').innerHTML = featList.map(p =>
  p.url
    ? `<div class="pub-row"><a href="${esc(p.url)}" target="_blank" rel="noopener">${p.citation}</a></div>`
    : `<div class="pub-row">${p.citation}</div>`
).join('') || '<p class="muted">No publications yet.</p>';

    document.getElementById('allPubs').innerHTML = (D.publications||[]).map(p =>
  `<div class="apa-item">
    ${p.pdf ? ` <a class="doi" href="${esc(p.pdf)}" target="_blank" rel="noopener">[pdf]</a>` : ''}
    ${p.citation}
    ${p.url ? `<br><a class="doi" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a>` : ''}
  </div>`
).join('') || '<p class="muted">No publications yet.</p>';

    document.getElementById('newsList').innerHTML = (D.news||[]).map(n=>
      `<a class="news-row" href="#news/${esc(n.id)}">
         <span class="t">${esc(n.title)}</span>
         <span class="d">${esc(fmtDate(n.date))}</span>
         <span class="s">${esc(n.summary||'')}</span>
       </a>`
    ).join('') || '<p class="muted">No updates yet.</p>';

    document.getElementById('peopleGroups').innerHTML = (D.groups||[]).map(g=>`
      <div class="group">
        <div class="group-head"><h2>${esc(g.title)}</h2></div>
        <div class="members">${(g.members||[]).map(memberCard).join('')}</div>
      </div>`).join('');

    function memberCard(m){
      const av = m.image
        ? `<span class="avatar-wrap"><img src="${esc(m.image)}" alt="${esc(m.name)}" onerror="this.replaceWith(Object.assign(document.createTextNode('${esc(initials(m.name))}')))"></span>`
        : `<span class="avatar-wrap">${esc(initials(m.name))}</span>`;
      const rows=[];
      if(m.institution) rows.push(`<div class="detail-row"><span class="lbl">Institution:</span> ${esc(m.institution)}</div>`);
      if(m.email) rows.push(`<div class="detail-row"><span class="lbl">Email:</span> <a href="mailto:${esc(m.email)}">${esc(m.email)}</a></div>`);
      if(m.website) rows.push(`<div class="detail-row"><span class="lbl">Website:</span> <a href="${esc(m.website)}" target="_blank" rel="noopener">${esc(m.website.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a></div>`);
      if(m.bio) rows.push(`<div class="member-bio">${esc(m.bio)}</div>`);
      return `<div class="member">
        <button class="member-toggle" type="button" aria-expanded="false">
          ${av}
          <span>
            <p class="member-name">${esc(m.name)}</p>
            <p class="member-role">${esc(m.role||'')}</p>
          </span>
        </button>
        <div class="member-details"><div class="inner">${rows.join('')}</div></div>
      </div>`;
    }

    document.getElementById('socialLinks').innerHTML = (D.social||[]).map(s=>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.label||s.icon)}" title="${esc(s.label||s.icon)}">${SOCIAL_ICONS[s.icon]||SOCIAL_ICONS.website}</a>`
    ).join('');

    document.addEventListener('click',e=>{
      const btn=e.target.closest('.member-toggle'); if(!btn) return;
      const m=btn.closest('.member'); const open=m.classList.toggle('open');
      btn.setAttribute('aria-expanded',open?'true':'false');
    });

    const pages=['home','people','publications'];
    function show(p){
      document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id===p));
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===p));
      window.scrollTo({top:0,behavior:'smooth'});
    }
    function renderNews(id){
      const n=(D.news||[]).find(x=>x.id===id);
      document.getElementById('newsDetail').innerHTML = n
        ? `<h2>${esc(n.title)}</h2><p class="d">${esc(fmtDate(n.date))}</p>${n.body||('<p>'+esc(n.summary||'')+'</p>')}`
        : '<h2>Update not found</h2>';
    }
    function route(){
      const h=location.hash.replace(/^#/,'');
      if(h.startsWith('news/')){
        renderNews(h.slice(5));
        document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='news'));
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        window.scrollTo({top:0,behavior:'smooth'}); return;
      }
      show(pages.includes(h)?h:'home');
    }
    window.addEventListener('hashchange',route);
    route();
  </script>
</body>
</html>
