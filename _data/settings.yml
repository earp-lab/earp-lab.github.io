people:
- {name: 'Brian D. Earp', 
  website: 'https://www.brianearp.com/',
  institution: 'National University of Singapore', 
  email: 'bdearp@nus.edu.sg', 
  bio: 'Associate Professor Brian D. Earp, PhD, is director of the Oxford-NUS Centre for Neuroethics and Society (OCNS) and the EARP Lab (Experimental Bioethics, Artificial Intelligence, and Relational Moral Psychology Lab) within the Centre for Biomedical Ethics, Yong Loo Lin School of Medicine, National University of Singapore (NUS). Brian is also an Associate Professor of Philosophy and of Psychology at NUS by courtesy. Brian holds degrees from Yale, Oxford, and Cambridge Universities and is a Research Associate of the Uehiro Oxford Institute at the University of Oxford. Brian is also Associate Director of the Yale-Hastings Program in Ethics and Health Policy at Yale University and The Hastings Center, and is an elected member of the UK Young Academy under the auspices of the British Academy and the Royal Society. See www.brianearp.com for more information.',
  image: 'assets/headshots/BrianDE.avif'}
  
